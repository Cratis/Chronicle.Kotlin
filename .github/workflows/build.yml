name: Kotlin Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - "Testing/**"
      - "Integrations/**"
      - "Samples/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    # A development kernel (MongoDB included) that the kernel-backed specifications run against.
    services:
      chronicle:
        image: cratis/chronicle:19.70.0-development
        ports:
          - 35000:35000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CI runs on a case-sensitive filesystem, so two paths differing only by case build
      # fine here and then break every contributor on macOS or Windows, where only one of
      # them can exist in the working tree.
      - name: Check for paths that differ only by case
        run: |
          collisions=$(git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$collisions" ]; then
            echo "::error::Paths differing only by case cannot be checked out on a case-insensitive filesystem:"
            echo "$collisions"
            exit 1
          fi

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      # The whole workspace, not just the client: a change to the test-support module or an
      # integration has to be built and tested too, and apiCheck only runs as part of a module's
      # own build.
      - name: Wait for the kernel
        run: timeout 180 bash -c 'until curl -skf https://localhost:35000/health > /dev/null; do sleep 2; done'

      - name: Build and test
        env:
          CHRONICLE_INTEGRATION_CONNECTION_STRING: chronicle://chronicle-dev-client:chronicle-dev-secret@localhost:35000
        run: gradle build --no-configuration-cache
