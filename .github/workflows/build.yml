name: Kotlin Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - "Samples/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CI runs on a case-sensitive filesystem, so two paths differing only by case build
      # fine here and then break every contributor on macOS or Windows, where only one of
      # them can exist in the working tree.
      - name: Check for paths that differ only by case
        run: |
          collisions=$(git ls-files | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$collisions" ]; then
            echo "::error::Paths differing only by case cannot be checked out on a case-insensitive filesystem:"
            echo "$collisions"
            exit 1
          fi

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and test
        run: gradle :Source:build --no-configuration-cache
