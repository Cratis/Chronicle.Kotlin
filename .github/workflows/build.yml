name: Kotlin Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - "Testing/**"
      - "Integrations/**"
      - "Samples/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # CI runs on a case-sensitive filesystem, so two paths differing only by case build
      # fine here and then break every contributor on macOS or Windows, where only one of
      # them can exist in the working tree.
      - name: Check for paths that differ only by case
        run: |
          collisions=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$collisions" ]; then
            echo "::error::Paths differing only by case cannot be checked out on a case-insensitive filesystem:"
            echo "$collisions"
            exit 1
          fi

      - name: Setup JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'

      # The whole workspace, not just the client: a change to the test-support module or an
      # integration has to be built and tested too, and apiCheck only runs as part of a module's
      # own build.
      - name: Build and test
        run: gradle build --no-configuration-cache
