name: Client Snippet Verification

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

  pull_request:
    branches:
      - "**"
    paths:
      - "Documentation/**/*.md"
      - "Documentation/validate-client-snippets.py"
      - "Documentation/validate-client-snippets.test.mjs"
      - "Source/**"
      - ".github/workflows/client-snippets.yml"

  push:
    branches: ["main"]
    paths:
      - "Documentation/**/*.md"
      - "Documentation/validate-client-snippets.py"
      - "Documentation/validate-client-snippets.test.mjs"
      - "Source/**"
      - ".github/workflows/client-snippets.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      # The real regression's final restored-valid run also compiles all snippets.
      - name: Verify client snippets and warm Java recompilation
        env:
          VALIDATE_CLIENT_SNIPPETS_REAL: '1'
        run: node --test Documentation/validate-client-snippets.test.mjs
